<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Let Us Care – Caring your loved ones</title>
<meta name="description" content="Free community app to find trusted carers for toddlers, elders and patients at home, plus tiffin, home cooks and cleaning. No commission.">
<meta name="theme-color" content="#003B9B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--blue:#003B9B;--blue-dk:#022A6E;--orange:#F57502;--orange-dk:#C95A00;--red:#E3262E;--ink:#1D2433;--muted:#5B6475;--line:#E7EAF0;--soft:#F4F7FC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:var(--ink);font-family:'Mukta',system-ui,sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:18px 18px calc(24px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column;gap:18px}
.logo{display:block;width:100%;max-width:400px;height:auto;margin:4px auto 0}
.intro{text-align:center;margin:-4px 0 0;font-size:16px;color:var(--muted);line-height:1.45}
.intro b{color:var(--blue);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:end}
.tile{display:block;width:100%;height:auto;border-radius:12px}
.btn{display:flex;align-items:center;gap:14px;text-decoration:none;border-radius:22px;padding:16px 16px;min-height:92px;color:#fff;position:relative;overflow:hidden}
.btn .ic{width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn .tx{flex:1;min-width:0}
.btn .t1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:23px;line-height:1.1;display:block}
.btn .t2{font-size:14.5px;line-height:1.3;opacity:.95;display:block;margin-top:3px}
.btn .ar{flex-shrink:0;opacity:.9}
.need{background:var(--blue);box-shadow:0 5px 0 var(--blue-dk)}
.give{background:var(--orange);box-shadow:0 5px 0 var(--orange-dk)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blue-dk)}
.give:active{box-shadow:0 2px 0 var(--orange-dk)}
.shine{position:absolute;top:0;left:-40%;width:30%;height:100%;background:rgba(255,255,255,.16);transform:skewX(-20deg)}
.extra{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--blue);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.chip svg{flex-shrink:0}
.promise{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--muted)}
.promise span{display:inline-flex;align-items:center;gap:5px}
.dev{margin-top:auto;text-align:center}.devt{margin:0 0 8px;font-size:13.5px;font-weight:600;color:var(--muted);letter-spacing:.2px}.vcard{display:block;width:100%;height:auto;border-radius:14px;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card{margin-top:auto;border:1px solid var(--line);border-radius:18px;padding:14px 16px;text-align:center;background:var(--soft)}
.card .by{font-size:12.5px;color:var(--muted)}
.card .co{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:18px;color:var(--blue);line-height:1.2}
.card .tag{font-size:13px;color:var(--orange-dk);font-weight:500}
.card a{color:var(--blue);font-size:14px;text-decoration:none;font-weight:500}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes shine{0%,65%{left:-40%}100%{left:130%}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(1)}45%{transform:scale(1.08)}}
@media (prefers-reduced-motion:no-preference){
.up{animation:rise .55s ease-out both}.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}.d5{animation-delay:.4s}
.tile{animation:bob 3.6s ease-in-out infinite}.tile:nth-child(2){animation-delay:.5s}.tile:nth-child(3){animation-delay:1s}.tile:nth-child(4){animation-delay:1.5s}
.shine{animation:shine 3.4s ease-in-out infinite}.give .shine{animation-delay:1.7s}
.beat{animation:beat 1.6s ease-in-out infinite;transform-origin:center}
}
</style>
</head>
<body>
<main class="wrap">
<img class="logo up" src="logo.webp" width="720" height="344" alt="Let Us Care – Caring your loved ones">
<p class="intro up d1">Trusted, verified carers at home for <b>children</b>, <b>elders</b>, <b>patients</b> and <b>new mothers</b>.</p>

<div class="tiles up d2" aria-hidden="true">
<img class="tile" src="toddler.webp" alt="" width="360" height="364">
<img class="tile" src="elder.webp" alt="" width="360" height="364">
<img class="tile" src="patient.webp" alt="" width="360" height="349">
<img class="tile" src="mother.webp" alt="" width="360" height="364">
</div>

<a class="btn need up d3" href="family.html">
<span class="shine"></span>
<span class="ic"><svg class="beat" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-9.6A4 4 0 0 1 12 8a4 4 0 0 1 7 2.4C19 15.6 12 20 12 20z"/></svg></span>
<span class="tx"><span class="t1">I need care</span><span class="t2">For my child, parent, a patient or a new mother</span></span>
<svg class="ar" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
</a>

<a class="btn give up d4" href="partner.html">
<span class="shine"></span>
<span class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14c2.5-1 4.5-1 6.5 0l3 1a1.6 1.6 0 0 1-1 3H9"/><path d="M3 20c3 0 4-1 7-1h4.5c1.2 0 2.2-.5 3-1.3L21 15a1.5 1.5 0 0 0-2.2-2l-3 2.3"/><path d="M15 4.5a2.3 2.3 0 0 1 3.5 0 2.3 2.3 0 0 1 3.5 0c1 1 1 2.6 0 3.6L18.5 11 15 8.1c-1-1-1-2.6 0-3.6z"/></svg></span>
<span class="tx"><span class="t1">I want to give care</span><span class="t2">Nannies, carers, nurses and massage experts</span></span>
<svg class="ar" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
</a>

<div class="promise up d5">
<span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1C8A4A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>100% free</span>
<span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1C8A4A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>No commission</span>
<span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1C8A4A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>Verified carers</span>
</div>

<div class="dev">
<p class="devt">App Designed &amp; Developed By</p>
<img class="vcard" src="card.webp" width="720" height="307" alt="Abode Digital Technology – Making Life Easier. Ajay Raval, C.E.O. abodedigitaltech@gmail.com, India 9860046593">
</div>
</main>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
</body>
</html>
